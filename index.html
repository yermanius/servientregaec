","direccion":"VIA A CHAMANGA S/N Y VIA A BOCA DE TIGUA MZ 8 SOLAR 16"},{"provincia":"El Oro","ciudad":"Huertas","establecimiento":"19 De Octubre","direccion":"19 DE OCTUBRE Y ANGEL CASTRO"},{"provincia":"Esmeraldas","ciudad":"La Sexta","establecimiento":"Principal","direccion":"CALLE A  MZ 33 SOLAR 7 Y OLMEDO"},{"provincia":"Esmeraldas","ciudad":"Mompiche","establecimiento":"Principal","direccion":"VIA A MOMPICHE S/N Y CALLE SEGUNDA MZ 238 SOLAR 9"}];let P={},C={},L=[],R=[];function init(){try{D.forEach(i=>{const p=i.provincia.trim(),c=i.ciudad.trim(),o={e:i.establecimiento.trim(),d:i.direccion.trim()};P[p]=P[p]||{};P[p][c]=P[p][c]||[];P[p][c].push(o);C[c]=C[c]||new Set();C[c].add(p)});L=Array.from(new Set(D.map(i=>i.ciudad.trim()))).sort((a,b)=>a.localeCompare(b,'es'));popProv();popCities();upDebug();attach()}catch(e){err('Error: '+e.message)}}
function popProv(){Object.keys(P).sort((a,b)=>a.localeCompare(b,'es')).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;document.getElementById('provinciaSelect').appendChild(o)})}
function popCities(fp='',ft=''){const s=document.getElementById('ciudadSelect'),pv=s.value;s.innerHTML='<option value="">Selecciona una ciudad</option>';let cs=[...L];if(fp)cs=cs.filter(c=>C[c].has(fp));if(ft){const q=ft.toLowerCase();cs=cs.filter(c=>c.toLowerCase().includes(q))}cs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});if(cs.includes(pv))s.value=pv}
function getOfi(c,p=''){if(!c)return[];const ps=p?[p]:Array.from(C[c]||[]);let r=[];ps.forEach(pv=>{if(P[pv]&&P[pv][c])P[pv][c].forEach(o=>r.push({...o,p:pv,c:c}))});return r}
function render(os){R=os;document.getElementById('resultsCount').textContent=`${os.length} oficina${os.length!==1?'s':''} encontrada${os.length!==1?'s':''}`;const g=document.getElementById('resultsGrid');if(os.length===0){g.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">No se encontraron oficinas</div></div>';return}g.innerHTML=os.map((o,i)=>`<div class="office-card"><div class="office-name">${esc(o.e)}</div><div class="office-address">${esc(o.d)}</div><div class="office-meta">${esc(o.c)} — ${esc(o.p)}</div><button class="copy-btn" onclick="copy(${i})">📋 Copiar</button></div>`).join('')}
function copy(i){const o=R[i],t=`RETIRA EN CS. SERVIENTREGA ${o.e} ${o.d}\n${o.c}, ${o.p}`;navigator.clipboard.writeText(t).then(()=>alert('✓ Copiado'))}
function copyAll(){if(R.length===0)return alert('No hay oficinas');const t=R.map(o=>`RETIRA EN CS. SERVIENTREGA ${o.e} ${o.d}\n${o.c}, ${o.p}\n`).join('\n');navigator.clipboard.writeText(t).then(()=>alert(`✓ ${R.length} direcciones copiadas`))}
function clear(){document.getElementById('provinciaSelect').value='';document.getElementById('buscarCiudadInput').value='';document.getElementById('ciudadSelect').value='';document.getElementById('filtroOficinaInput').value='';popCities();render([])}
function test(){try{const c=L[0]||'Guayaquil',os=getOfi(c);document.getElementById('debugContent').innerHTML=`<div class="status-ok">✓ Test OK</div><p>Ciudad: ${c}</p><p>Oficinas: ${os.length}</p>`}catch(e){err('Test falló: '+e.message)}}
function upDebug(){document.getElementById('debugContent').innerHTML=`<div class="status-ok">✓ OK</div><p>Provincias: ${Object.keys(P).length} | Ciudades: ${L.length} | Oficinas: ${D.length}</p>`}
function err(m){document.getElementById('debugContent').innerHTML=`<div class="status-error">✗ ${m}</div>`}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function attach(){document.getElementById('provinciaSelect').addEventListener('change',()=>{popCities(document.getElementById('provinciaSelect').value,document.getElementById('buscarCiudadInput').value);const c=document.getElementById('ciudadSelect').value;if(c)filter(getOfi(c,document.getElementById('provinciaSelect').value))});document.getElementById('buscarCiudadInput').addEventListener('input',()=>popCities(document.getElementById('provinciaSelect').value,document.getElementById('buscarCiudadInput').value));document.getElementById('ciudadSelect').addEventListener('change',()=>{const c=document.getElementById('ciudadSelect').value;if(!c){render([]);return}const ps=Array.from(C[c]||[]);if(ps.length===1&&!document.getElementById('provinciaSelect').value)document.getElementById('provinciaSelect').value=ps[0];filter(getOfi(c,document.getElementById('provinciaSelect').value))});document.getElementById('filtroOficinaInput').addEventListener('input',()=>{const c=document.getElementById('ciudadSelect').value;if(c)filter(getOfi(c,document.getElementById('provinciaSelect').value))});document.getElementById('limpiarBtn').addEventListener('click',clear);document.getElementById('copiarTodasBtn').addEventListener('click',copyAll);document.getElementById('autoTestBtn').addEventListener('click',test)}
function filter(os){const f=document.getElementById('filtroOficinaInput').value.toLowerCase();render(f?os.filter(o=>o.e.toLowerCase().includes(f)||o.d.toLowerCase().includes(f)||o.p.toLowerCase().includes(f)):os)}
window.copy=copy;document.addEventListener('DOMContentLoaded',init);
</script>
